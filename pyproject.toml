[project]
name = "namegen"
version = "0.1.0"
description = "Tiny character-level GPT that learns to generate names. Demo repo for 'From Model to Agent'."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "streamlit>=1.38",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["namegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
